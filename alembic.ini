# Alembic configuration.
#
# Note what is *not* here: sqlalchemy.url. The database is chosen by
# DATABASE_URL, and migrations/env.py reads it from the app's own config so that
# `alembic upgrade head` and `flask --app app upgrade-db` can never disagree
# about which database they are migrating.
#
# It is also a trap worth avoiding: Alembic parses this file with a configparser
# that interpolates `%`, and percent-encoded characters are common in Postgres
# passwords.

[alembic]
script_location = migrations

# Revisions are named 0001_..., 0002_... so that `ls versions/` reads in
# dependency order. Alembic's own ordering comes from down_revision, not the
# filename, but a directory that sorts wrongly is a needless daily annoyance.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
